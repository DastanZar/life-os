plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 36
    namespace "com.lifeos.bodyos"
    defaultConfig {
        applicationId "com.lifeos.bodyos"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"

        resValue "string", "appName", "BODY OS"
        resValue "string", "launcherName", "BODY OS"
        resValue "string", "launchUrl", "https://does-diagram-fairly-ran.trycloudflare.com/index.html"
        resValue "string", "hostName", "does-diagram-fairly-ran.trycloudflare.com"
        resValue "color", "colorPrimary", "#ff7b00"
        resValue "color", "colorPrimaryDark", "#ff7b00"
        resValue "color", "navigationColor", "#0a0e12"
        resValue "color", "navigationColorDark", "#0a0e12"
        resValue "color", "navigationDividerColor", "#00000000"
        resValue "color", "navigationDividerColorDark", "#00000000"
        resValue "color", "backgroundColor", "#0a0e12"
        resValue "string", "providerAuthority", "com.lifeos.bodyos.fileprovider"
        resValue "bool", "enableNotification", "false"
        resValue "integer", "splashScreenFadeOutDuration", "300"
        resValue "string", "generatorApp", "bubblewrap-cli"
        resValue "string", "fallbackType", "customtabs"
        resValue "bool", "enableSiteSettingsShortcut", "false"
        resValue "string", "orientation", "portrait"
    }
    buildTypes {
        release {
            minifyEnabled true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
